name: Documentation Sync
on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.md'
      - 'docs/**'
      - 'README*'
      - 'CHANGELOG*'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

# Inlined from jclee941/.github/.github/workflows/42_reusable-docs-sync.yml@master
# so this repo can pass extra --exclude args to lychee that the reusable
# workflow's args block didn't honor (the action's `with: args:` is
# argv-replacement, so .lycheeignore / lychee.toml at the repo root weren't
# being picked up reliably). All four jobs (link-check, markdown-lint,
# readme-sync-check, api-docs-check) preserved verbatim from the reusable;
# only link-check's `args:` block is augmented with --exclude patterns for
# self-hosted services, placeholders, the renamed qws941/* org path, and
# auth-walled dashboards that fail from GitHub-hosted runners.
jobs:
  link-check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6

      # Link check is informational only — broken-link signal is preserved
      # in the action logs but does not block merge. The repo has a large
      # surface of historical / placeholder / self-hosted URLs whose
      # liveness is orthogonal to PR correctness; fixing them is tracked
      # separately.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >
            --exclude-all-private
            --exclude-mail
            --timeout 30
            --retry 3
            --no-progress
            --accept 200,203,204,301,302,307,308,401,403,405,429,500,503,999
            --exclude ^https?://([a-z0-9.-]+\.)?jclee\.me
            --exclude ^https?://([a-z0-9.-]+\.)?jaecheol\.io
            --exclude ^https?://([a-z0-9.-]+\.)?example\.(com|org|net)
            --exclude ^https?://github\.com/qws941/
            --exclude ^https?://dash\.cloudflare\.com/
            --exclude ^https?://lheunx\.tistory\.com
            --exclude \[ACCOUNT_ID\]
            --exclude YOUR_(ORG|REPO|ACCOUNT_ID|API_TOKEN)
            README.md
            docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore .venv \
            --ignore '**/pr-agent-upstream-README.md'

  readme-sync-check:
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check README sync
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const changedFiles = files.map(f => f.filename);
            const hasCodeChanges = changedFiles.some(f =>
              f.endsWith('.py') || f.endsWith('.js') || f.endsWith('.ts') ||
              f.endsWith('.go') || f.endsWith('.rs') || f.endsWith('.java')
            );
            const hasConfigChanges = changedFiles.some(f =>
              f.endsWith('.toml') || f.endsWith('.yaml') || f.endsWith('.yml') ||
              f.endsWith('.json') || f.includes('.env')
            );
            const hasReadmeChange = changedFiles.some(f => f.toLowerCase().includes('readme'));
            const hasDocChange = changedFiles.some(f =>
              f.startsWith('docs/') || f.endsWith('.md')
            );

            const warnings = [];

            if (hasCodeChanges && !hasReadmeChange && !hasDocChange) {
              warnings.push('⚠️ 코드 변경이 있지만 README.md나 문서 업데이트가 없습니다. 새 기능/API 변경 시 문서 업데이트를 고려하세요.');
            }

            if (hasConfigChanges && !hasReadmeChange) {
              warnings.push('⚠️ 설정 파일 변경이 있지만 README 업데이트가 없습니다. 설정 예시나 사용법 문서를 업데이트하세요.');
            }

            if (warnings.length > 0) {
              const body = `## 📚 문서 현행화 체크\n\n` +
                warnings.join('\n\n') + '\n\n' +
                `> 자동 생성됨 (Documentation Sync Workflow)`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  api-docs-check:
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check API documentation
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const changedFiles = files.map(f => f.filename);

            const hasApiChanges = changedFiles.some(f =>
              f.includes('route') || f.includes('api') || f.includes('endpoint') ||
              f.includes('handler') || f.includes('controller')
            );

            const hasApiDocs = changedFiles.some(f =>
              f.includes('openapi') || f.includes('swagger') ||
              f.includes('api-doc') || (f.startsWith('docs/') && f.includes('api'))
            );

            if (hasApiChanges && !hasApiDocs) {
              const body = `## 🔌 API 문서 체크\n\n` +
                `⚠️ API 관련 코드 변경이 있지만 API 문서 업데이트가 없습니다.\n\n` +
                `변경된 파일:\n` +
                changedFiles.filter(f => f.includes('route') || f.includes('api') || f.includes('endpoint')).map(f => `- \`${f}\``).join('\n') + '\n\n' +
              `OpenAPI/Swagger 명세나 API 문서를 업데이트했는지 확인하세요.\n\n` +
                `> 자동 생성됨 (Documentation Sync Workflow)`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
