name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The public repo holds no personal content; build and tests run on the fake pack.
      CONTENT_SOURCE: fixtures

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard against committed personal content
        run: node tools/scripts/content/cli.mjs guard --tracked

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/scripts/go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/scripts/build/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r tools/scripts/build/requirements.txt

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Build generated Worker inputs
        run: npm run build

      - name: Lint
        run: |
          npm run lint
          npm run format:check
          npm run lint:loc
          npm run lint:naming
          npm run lint:agents

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:strict

      - name: Test workspaces
        run: |
          npm run test:jest
          npm run test:dashboard
          npm run test:schemas
          npm run test:shared
          npm run test:tools
          npm run test:cli
          npm run test:go
          npm run test:python

      - name: Verify architecture contracts
        run: npm run verify:architecture-hardening:core

      - name: Build Worker and validate Wrangler bundle
        run: npm run deploy:wrangler:root:dry-run
