name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated Worker inputs
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test JavaScript workspaces
        run: |
          npm run test:jest
          npm run test:node
          npm run test:schemas
          npm run test:shared
          npm run test:tools
          npm run test:cli

      - name: Verify architecture contracts
        run: npm run verify:architecture-hardening:core

      - name: Build Worker and validate Wrangler bundle
        run: npm run deploy:wrangler:root:dry-run
