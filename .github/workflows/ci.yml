name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The public repo holds no personal content; build and tests run on the fake pack.
      CONTENT_SOURCE: fixtures

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard against committed personal content
        run: node tools/scripts/content/cli.mjs guard --tracked

      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          # Published in gitleaks_8.30.1_checksums.txt of the v8.30.1 release (linux_x64 tarball).
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tool_dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $tool_dir/$archive" | sha256sum --check --strict
          mkdir "$tool_dir/bin"
          tar -xzf "$tool_dir/$archive" -C "$tool_dir/bin" gitleaks
          "$tool_dir/bin/gitleaks" dir . --config .gitleaks.toml --redact --no-banner

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Published in actionlint_1.7.12_checksums.txt of the v1.7.12 release (linux_amd64 tarball).
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tool_dir/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $tool_dir/$archive" | sha256sum --check --strict
          mkdir "$tool_dir/bin"
          tar -xzf "$tool_dir/$archive" -C "$tool_dir/bin" actionlint
          "$tool_dir/bin/actionlint" -color

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/scripts/go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/scripts/build/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r tools/scripts/build/requirements.txt

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Build generated Worker inputs
        run: npm run build

      - name: Lint
        run: |
          npm run lint
          npm run format:check
          npm run lint:loc
          npm run lint:naming
          npm run lint:agents

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:strict

      - name: Test workspaces
        run: |
          npm run test:jest
          npm run test:dashboard
          npm run test:schemas
          npm run test:shared
          npm run test:tools
          npm run test:cli
          npm run test:go
          npm run test:python

      - name: Verify architecture contracts
        run: npm run verify:architecture-hardening:core

      - name: Build Worker and validate Wrangler bundle
        run: npm run deploy:wrangler:root:dry-run
