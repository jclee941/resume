name: Post-Deploy Verification

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Immutable 40-character deployment SHA'
        required: true
        type: string
      base_url:
        description: 'Base URL to verify'
        required: false
        default: 'https://resume.jclee.me'
        type: string
      dry_run:
        description: 'Skip GitHub issue mutations'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy-verify-master
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ${{ github.repository_visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://resume.jclee.me' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Resolve immutable expected SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              EXPECTED_SHA="$PUSH_SHA"
              ;;
            workflow_dispatch)
              EXPECTED_SHA="$DISPATCH_SHA"
              ;;
            schedule)
              HEALTH=$(curl --fail-with-body --silent --show-error --max-time 30 \
                -H 'accept: application/json' "$BASE_URL/health")
              EXPECTED_SHA=$(jq -er '.git_sha' <<<"$HEALTH")
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Expected SHA must be exactly 40 lowercase hexadecimal characters'
            exit 1
          }
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Query initial master tip
        id: initial
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          CURRENT_TIP=$(git ls-remote origin refs/heads/master | awk '{print $1}')
          [[ "$CURRENT_TIP" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$CURRENT_TIP" != "$EXPECTED_SHA" ]; then
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
          else
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
          fi
          echo "current_tip=$CURRENT_TIP" >> "$GITHUB_OUTPUT"

      - name: Wait for exact deployment SHA
        id: wait
        if: github.event_name != 'schedule' && steps.initial.outputs.superseded != 'true'
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIP_ARGS=()
          if [ "${{ github.event_name }}" = 'push' ]; then
            TIP_ARGS=(--current-tip-url "${{ github.api_url }}/repos/${{ github.repository }}/git/ref/heads/master")
          fi
          go -C tools/scripts run ./verification/wait-for-deployment \
            --health-url "$BASE_URL/health" \
            --expected-sha "$EXPECTED_SHA" \
            --poll-interval 10s \
            --timeout 5m \
            "${TIP_ARGS[@]}" | tee /tmp/deployment-receipt.json
          echo "superseded=$(jq -r '.superseded' /tmp/deployment-receipt.json)" >> "$GITHUB_OUTPUT"

      - name: Record schedule receipt without waiting
        if: github.event_name == 'schedule'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          printf '{"superseded":false,"expected_sha":"%s","attempts":0}\n' "$EXPECTED_SHA" \
            > /tmp/deployment-receipt.json

      - name: Record initially superseded receipt
        if: steps.initial.outputs.superseded == 'true'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          CURRENT_TIP: ${{ steps.initial.outputs.current_tip }}
        run: |
          printf '{"superseded":true,"expected_sha":"%s","current_tip":"%s","attempts":0}\n' \
            "$EXPECTED_SHA" "$CURRENT_TIP" > /tmp/deployment-receipt.json

      - name: Run strict merged-worker production contract
        id: playwright
        if: steps.initial.outputs.superseded != 'true' && steps.wait.outputs.superseded != 'true'
        continue-on-error: true
        env:
          SKIP_WEBSERVER: '1'
          STRICT_PRODUCTION: '1'
          EXPECTED_GIT_SHA: ${{ steps.target.outputs.expected_sha }}
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: |
          npx playwright test tests/e2e/merged-worker-contract.spec.js --project=chromium \
            2>&1 | tee /tmp/playwright.log
          exit "${PIPESTATUS[0]}"

      - name: Query final master tip
        id: final
        if: always()
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          WAIT_SUPERSEDED: ${{ steps.wait.outputs.superseded || 'false' }}
          INITIAL_SUPERSEDED: ${{ steps.initial.outputs.superseded || 'false' }}
        run: |
          set -euo pipefail
          SUPERSEDED=false
          CURRENT_TIP=''
          if [ "${{ github.event_name }}" = 'push' ]; then
            CURRENT_TIP=$(git ls-remote origin refs/heads/master | awk '{print $1}')
            [[ "$CURRENT_TIP" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if [ "$CURRENT_TIP" != "$EXPECTED_SHA" ]; then SUPERSEDED=true; fi
          fi
          if [ "$WAIT_SUPERSEDED" = 'true' ] || [ "$INITIAL_SUPERSEDED" = 'true' ]; then
            SUPERSEDED=true
          fi
          echo "superseded=$SUPERSEDED" >> "$GITHUB_OUTPUT"
          echo "current_tip=$CURRENT_TIP" >> "$GITHUB_OUTPUT"
          echo "superseded=$SUPERSEDED expected_sha=$EXPECTED_SHA current_tip=$CURRENT_TIP"

      - name: Aggregate strict outcome
        id: outcome
        if: always()
        env:
          SUPERSEDED: ${{ steps.final.outputs.superseded }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          set -euo pipefail
          FAILED=false
          if [ "$SUPERSEDED" != 'true' ] && {
            [ "$WAIT_OUTCOME" = 'failure' ] || [ "$PLAYWRIGHT_OUTCOME" = 'failure' ];
          }; then
            FAILED=true
          fi
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-receipt-${{ github.run_id }}
          path: |
            /tmp/deployment-receipt.json
            /tmp/playwright.log
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Ensure issue labels exist
        if: steps.final.outputs.superseded != 'true' && steps.outcome.outputs.failed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create deploy-verification --color B60205 --description 'Post-deploy failure' 2>/dev/null || true
          gh label create automated --color BFD4F2 --description 'Automated issue' 2>/dev/null || true

      - name: Create failure issue
        if: steps.final.outputs.superseded != 'true' && steps.outcome.outputs.failed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          TITLE="[deploy-verify] production check failed at ${EXPECTED_SHA:0:8}"
          EXISTING=$(gh issue list --label deploy-verification --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Verification failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$TITLE" --label deploy-verification,automated \
              --body "Strict exact-SHA merged Worker verification failed for \`$EXPECTED_SHA\`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Close stale verification issues
        if: steps.final.outputs.superseded != 'true' && steps.outcome.outputs.failed == 'false' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          for issue in $(gh issue list --label deploy-verification --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed \
              --comment "Resolved by strict verification of $EXPECTED_SHA."
          done

      - name: Fail current verification
        if: steps.final.outputs.superseded != 'true' && steps.outcome.outputs.failed == 'true'
        run: exit 1
