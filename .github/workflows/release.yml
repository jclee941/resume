name: Release

# Creates semver-bumped tag + GitHub Release after successful CI on master.
# Production deployment is intentionally left to Cloudflare Workers Builds.
# Ported from .gitlab-legacy/ci/release.yml. Conventional Commits based:
#   feat!/BREAKING CHANGE → major bump
#   feat(...)             → minor bump
#   fix/chore/docs/...    → patch bump

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next tag without creating anything'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Tag, Bump & Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Production environment can be configured in GitHub Settings → Environments →
    # "production" with required reviewers + wait-timer if a manual gate is desired.
    # Workflow_dispatch with dry_run=false also serves as an explicit human trigger.
    environment:
      name: production
      url: https://resume.jclee.me
    permissions:
      contents: write
    # Only run on successful CI (workflow_run) or manual dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Determine version bump
        id: bump
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')
          # If LAST_TAG points to HEAD (release-publish.yml races us), step back to the prior tag
          # so we still see the commits the user actually pushed.
          if [ "$LAST_TAG" != 'v0.0.0' ] && [ "$(git rev-parse "${LAST_TAG}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            PRIOR_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${LAST_TAG}^" 2>/dev/null || echo 'v0.0.0')
            echo "Last tag ${LAST_TAG} is at HEAD; using prior tag ${PRIOR_TAG} for changelog range."
            LAST_TAG="$PRIOR_TAG"
          fi
          echo "Last tag: ${LAST_TAG}"

          VERSION="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:'%s%n%b' 2>/dev/null || \
                    git log --pretty=format:'%s%n%b')

          if [ -z "$(echo "$COMMITS" | tr -d '[:space:]')" ]; then
            echo "No commits since ${LAST_TAG}; skipping release."
            {
              echo "should_release=false"
              echo "new_tag=${LAST_TAG}"
              echo "bump=skip"
              echo "changelog="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE '(BREAKING[[:space:]]CHANGE|^[a-z]+(\([^)]*\))?!:)'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?(!)?:'; then
            BUMP="minor"
          fi
          echo "Bump type: ${BUMP}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          # If NEW_TAG already exists (race with release-publish.yml), bump again until free
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "New tag: ${NEW_TAG}"

          CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:'- %s (%h)' 2>/dev/null || \
                      git log --pretty=format:'- %s (%h)')

          {
            echo "should_release=true"
            echo "new_tag=${NEW_TAG}"
            echo "bump=${BUMP}"
            echo "last_tag=${LAST_TAG}"
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — would create tag ${NEW_TAG}"
            echo ""
            echo "=== Changelog preview ==="
            echo "$CHANGELOG"
          fi
      # NOTE: We intentionally do NOT commit package.json / CHANGELOG.md updates
      # back to master from this workflow. Branch protection rejects bot pushes
      # (GH006), and routing the release through a PR adds friction. The tag +
      # GitHub Release contains the full changelog, which is sufficient as the
      # historical record. If `package.json.version` ever needs to track the
      # tag for runtime use, prefer reading it from `git describe` at build time
      # or via a manual PR.

      - name: Create tag and GitHub Release
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Release ${{ steps.bump.outputs.new_tag }}
          body: |
            ## ${{ steps.bump.outputs.new_tag }}

            Bump: ${{ steps.bump.outputs.bump }} (from ${{ steps.bump.outputs.last_tag }})

            ### Changes
            ${{ steps.bump.outputs.changelog }}
          draft: false
          prerelease: false
          target_commitish: master
          generate_release_notes: false

      - name: Sync SSoT → portfolio data*.json (release artifact inputs)
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        # apps/portfolio/data*.json are generated from packages/data/resumes/master/
        # by tools/scripts/utils/sync-resume-data.js. They were untracked in 9fc8e4f
        # so CI must regenerate them before packaging the worker artifact.
        run: npm run sync:data

      - name: Build portfolio worker artifact
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        run: npm run build

      - name: Package release artifacts
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp apps/portfolio/worker.js dist/release/worker.js
          cp apps/portfolio/wrangler.jsonc dist/release/wrangler.jsonc
          tar -C dist/release -czf "dist/portfolio-worker-${{ steps.bump.outputs.new_tag }}.tar.gz" .

      - name: Upload workflow artifact
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-worker-${{ steps.bump.outputs.new_tag }}
          path: dist/portfolio-worker-${{ steps.bump.outputs.new_tag }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifact to GitHub Release
        if: steps.bump.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          files: dist/portfolio-worker-${{ steps.bump.outputs.new_tag }}.tar.gz

      # Production deployment is intentionally omitted here. AGENTS.md and
      # package.json declare Cloudflare Workers Builds as the authoritative
      # deploy path; local wrangler deploys are non-authoritative.

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Should release**: ${{ steps.bump.outputs.should_release }}"
            echo "- **Bump type**: ${{ steps.bump.outputs.bump }}"
            echo "- **Last tag**: ${{ steps.bump.outputs.last_tag }}"
            echo "- **New tag**: ${{ steps.bump.outputs.new_tag }}"
            echo "- **Dry run**: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- **Trigger**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
