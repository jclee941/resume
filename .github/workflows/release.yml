name: Release
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current master tip (40 lowercase hex characters)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  prepare:
    name: Decide immutable release target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
      next_tag: ${{ steps.decision.outputs.next_tag }}
      target_sha: ${{ env.TARGET_SHA }}
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Resolve current remote tip and release policy
        id: decision
        env:
          TRIGGER_KIND: ${{ github.event_name == 'workflow_run' && 'automated' || 'manual' }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'manual/automated target must be a lowercase 40-hex SHA' >&2
            exit 1
          fi
          REMOTE_TIP=$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')
          test -n "$REMOTE_TIP"
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          go -C tools/scripts run ./release/next-version \
            --repo ../.. --target "$TARGET_SHA" --remote-tip "$REMOTE_TIP" \
            --trigger "$TRIGGER_KIND" --output ../../release-decision.json
          jq -e --arg target "$TARGET_SHA" '.target_sha == $target and (.decision == "publish" or .decision == "no-release" or .decision == "superseded")' release-decision.json
          echo "decision=$(jq -r .decision release-decision.json)" >> "$GITHUB_OUTPUT"
          echo "next_tag=$(jq -r '.next_tag // ""' release-decision.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release decision
        if: always() && hashFiles('release-decision.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-decision-${{ github.run_id }}
          path: release-decision.json
          if-no-files-found: error

  verify:
    name: Reproduce and verify release source
    needs: [prepare]
    if: needs.prepare.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      TAG: ${{ needs.prepare.outputs.next_tag }}
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Download decision
        uses: actions/download-artifact@v8
        with:
          name: release-decision-${{ github.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build deterministic source bundle twice
        run: |
          set -euo pipefail
          mkdir -p dist/archive-a dist/archive-b dist/extracted
          ASSET="resume-source-${TAG}.tar.gz"
          git archive --format=tar --prefix="resume-${TAG}/" "$TARGET_SHA" | gzip -n -9 > "dist/archive-a/${ASSET}"
          git archive --format=tar --prefix="resume-${TAG}/" "$TARGET_SHA" | gzip -n -9 > "dist/archive-b/${ASSET}"
          cmp "dist/archive-a/${ASSET}" "dist/archive-b/${ASSET}"
          tar -tzf "dist/archive-a/${ASSET}" > dist/archive-members.txt
          if awk '/(^|\/)\.env([^/]*$|\/)/ && $0 !~ /\.example$/ { print; bad=1 } /(^|\/)\.dev\.vars$/ { print; bad=1 } END { exit bad }' dist/archive-members.txt; then :; else
            echo 'archive contains forbidden environment material' >&2
            exit 1
          fi
          tar -xzf "dist/archive-a/${ASSET}" -C dist/extracted

      - name: Secret scan exported members
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          "$(go env GOPATH)/bin/gitleaks" dir \
            --config .gitleaks.toml --redact --no-banner \
            "dist/extracted/resume-${TAG}"

      - name: Reproduce build and production dry-run
        run: |
          set -euo pipefail
          SOURCE_ROOT="$PWD/dist/extracted/resume-${TAG}"
          COMMIT_DATE=$(git show -s --format=%cI "$TARGET_SHA" | cut -c1-10)
          cd "$SOURCE_ROOT"
          npm ci --prefer-offline --no-audit --no-fund
          export GIT_SHA="$TARGET_SHA"
          export RESUME_AS_OF="$COMMIT_DATE"
          npm run verify:ssot
          npm run build
          env CLOUDFLARE_ENV= npx wrangler deploy --config wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/release-dry-run"
          grep -Fq "$TARGET_SHA" apps/portfolio/worker.js

      - name: Write and verify release manifest
        run: |
          set -euo pipefail
          ASSET="resume-source-${TAG}.tar.gz"
          cp "dist/archive-a/${ASSET}" "dist/${ASSET}"
          DIGEST=$(sha256sum "dist/${ASSET}" | awk '{ print $1 }')
          SIZE=$(stat --format='%s' "dist/${ASSET}")
          SOURCE_EPOCH=$(git show -s --format=%ct "$TARGET_SHA")
          jq -n \
            --arg target "$TARGET_SHA" --arg tag "$TAG" --arg name "$ASSET" \
            --arg digest "sha256:${DIGEST}" --argjson size "$SIZE" \
            --argjson source_epoch "$SOURCE_EPOCH" \
            '{target_sha:$target,tag:$tag,name:$name,digest:$digest,size:$size,source_epoch:$source_epoch}' \
            > dist/release-manifest.json
          jq -e --arg target "$TARGET_SHA" --arg tag "$TAG" --arg name "$ASSET" \
            --arg digest "sha256:${DIGEST}" --argjson size "$SIZE" \
            '.target_sha == $target and .tag == $tag and .name == $name and .digest == $digest and .size == $size' \
            dist/release-manifest.json
          RANGE=$(jq -er .range release-decision.json)
          git log --format='- %s (%h)' "$RANGE" > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Upload verified release inputs before external writes
        run: cp release-decision.json dist/release-decision.json

      - name: Persist verified release inputs before external writes
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ env.TAG }}
          path: |
            dist/resume-source-${{ env.TAG }}.tar.gz
            dist/release-manifest.json
            dist/release-notes.md
            dist/archive-members.txt
            dist/release-decision.json
          if-no-files-found: error

  publish:
    name: Publish verified draft
    needs: [prepare, verify]
    if: needs.prepare.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      TAG: ${{ needs.prepare.outputs.next_tag }}
    steps:
      - name: Checkout immutable target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Download verified release inputs
        uses: actions/download-artifact@v8
        with:
          name: verified-release-${{ env.TAG }}
          path: dist

      - name: Run tested release transaction
        run: |
          set -euo pipefail
          go -C tools/scripts run ./release/publish \
            --target "$TARGET_SHA" --tag "$TAG" \
            --asset "../../dist/resume-source-${TAG}.tar.gz" \
            --manifest ../../dist/release-manifest.json \
            --notes ../../dist/release-notes.md \
            --run-marker "release-run:${GITHUB_RUN_ID}"
