version: 2
updates:
  # Workflow actions are pinned to release commit SHAs.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # PPTX tooling requirements installed by CI's test:python step.
  - package-ecosystem: 'pip'
    directory: '/tools/scripts/build'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      python-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Go modules built and tested by CI's test:go step and the Go operations tooling.
  - package-ecosystem: 'gomod'
    directory: '/tools/scripts'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'go'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      go-scripts-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'gomod'
    directory: '/tools/scripts/enrichment'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'go'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      go-enrichment-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # npm workspaces share the root package-lock.json.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
