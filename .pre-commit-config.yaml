# Pre-commit hooks for resume monorepo
# Install: `pre-commit install` (requires `pip install pre-commit` or `brew install pre-commit`)
# Run manually: `pre-commit run --all-files`
# Skip (NOT RECOMMENDED): `SKIP=gitleaks git commit ...`

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        description: Scans staged files for secrets using .gitleaks.toml
        args:
          - protect
          - --staged
          - --config=.gitleaks.toml
          - --redact
          - --verbose

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(infrastructure/n8n|\.gitlab-legacy)/
      - id: check-json
        exclude: ^(.*\.jsonc|.*\.json5)$
      - id: end-of-file-fixer
        exclude: \.(min\.(js|css)|map|generated\..*)$
      - id: trailing-whitespace
        exclude: \.(md|markdown)$
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch=master]
        stages: [pre-commit]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files (markdownlint)
        args: [--fix]
        exclude: ^(node_modules|\.venv|.*pr-agent-upstream-README\.md)/

  - repo: local
    hooks:
      - id: eslint
        name: Lint JavaScript/TypeScript (eslint)
        entry: npx --no-install eslint --cache
        language: system
        types_or: [javascript, jsx, ts, tsx]
        require_serial: false
        pass_filenames: true
        exclude: ^(node_modules|dist|build|coverage|\.wrangler|playwright-report)/
