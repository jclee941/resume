openapi: 3.0.3
info:
  title: Job Automation API
  description: REST API for job search, application tracking, and auto-apply automation
  version: 1.4.0
  contact:
    email: qws941@kakao.com

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://resume.jclee.me/job
    description: Production (Cloudflare Worker)

tags:
  - name: Health
    description: Service health endpoints
  - name: Applications
    description: Job application CRUD
  - name: Search
    description: Job search across platforms
  - name: Stats
    description: Statistics and reports
  - name: AutoApply
    description: Automated job application

security: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health:
    get:
      tags: [Health]
      summary: API health check
      responses:
        '200':
          description: API healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health/notifications:
    get:
      tags: [Health]
      summary: Notification subsystem health (Telegram + n8n configuration)
      responses:
        '200':
          description: Notification configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  telegram:
                    type: object
                  n8n:
                    type: object

  /api/status:
    get:
      tags: [Health]
      summary: Service status with deploy metadata + bindings overview
      responses:
        '200':
          description: Service status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  deployed_at:
                    type: string
                  bindings:
                    type: object

  /api/applications:
    get:
      tags: [Applications]
      summary: List applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, saved, applied, viewed, in_progress, interview, offer, rejected, withdrawn, expired]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

    post:
      tags: [Applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  $ref: '#/components/schemas/Job'
                options:
                  type: object
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

  /api/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [Applications]
      summary: Get application by ID
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Not found

    put:
      tags: [Applications]
      summary: Update application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  application:
                    $ref: '#/components/schemas/Application'

    delete:
      tags: [Applications]
      summary: Delete application
      responses:
        '200':
          description: Deleted

  /api/applications/{id}/status:
    put:
      tags: [Applications]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, saved, applied, viewed, in_progress, interview, offer, rejected, withdrawn, expired]
                note:
                  type: string
                notifyN8n:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Status updated

  /api/search:
    get:
      tags: [Search]
      summary: Search jobs
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            default: 보안 엔지니어
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: minScore
          in: query
          schema:
            type: integer
            default: 50
        - name: platforms
          in: query
          description: Comma-separated platform list
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  /api/search/batch:
    post:
      tags: [Search]
      summary: Batch search with multiple keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  default: [보안 엔지니어, DevOps, 인프라]
                platforms:
                  type: array
                  items:
                    type: string
                limit:
                  type: integer
                  default: 10
                minScore:
                  type: integer
                  default: 60
      responses:
        '200':
          description: Batch search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  totalJobs:
                    type: integer

  /api/stats:
    get:
      tags: [Stats]
      summary: Get application statistics
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /api/stats/weekly:
    get:
      tags: [Stats]
      summary: Get weekly report
      responses:
        '200':
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'

  /api/report:
    get:
      tags: [Stats]
      summary: Get daily report
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily report

  /api/report/weekly:
    get:
      tags: [Stats]
      summary: Get weekly report (alias)
      responses:
        '200':
          description: Weekly report

  /api/cleanup:
    post:
      tags: [Stats]
      summary: Cleanup old applications
      responses:
        '200':
          description: Cleanup result

  /api/auto-apply/status:
    get:
      tags: [AutoApply]
      summary: Get auto-apply status
      responses:
        '200':
          description: Auto-apply status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApplyStatus'

  /api/auto-apply/run:
    post:
      tags: [AutoApply]
      summary: Start auto-apply process
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoApplyRunRequest'
      responses:
        '200':
          description: Auto-apply run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApplyRunResponse'

  # ===== ADDED 2026-04-29 closing OpenAPI drift (audit P1) =====
  # Auth routes (apps/job-dashboard/src/routes/auth.js)
  /api/auth/status:
    get:
      tags: [Auth]
      summary: Current admin session status
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  expiresAt:
                    type: string

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Mint a 4h HMAC session token from a valid ADMIN_TOKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Sets adminToken cookie
        '401':
          description: Invalid token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear admin session cookie
      responses:
        '200':
          description: Session cleared

  /api/auth/sync:
    post:
      tags: [Auth]
      summary: Ingest platform cookies from external script (requires X-Auth-Sync-Secret)
      parameters:
        - in: header
          name: X-Auth-Sync-Secret
          schema:
            type: string
          required: true
      responses:
        '200': { description: Synced }
        '401': { description: Invalid secret }
        '503': { description: AUTH_SYNC_SECRET not configured }

  /api/auth/set:
    post:
      tags: [Auth]
      summary: Manually set platform auth (admin)
      responses:
        '200':
          description: Auth updated

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Read Wanted profile via authenticated session
      responses:
        '200':
          description: Profile status

  /api/auth/{platform}:
    delete:
      tags: [Auth]
      summary: Clear platform-specific session
      parameters:
        - in: path
          name: platform
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Platform session cleared

  # Workflows (apps/job-dashboard/src/routes/workflows.js)
  /api/workflows/job-crawling:
    post:
      tags: [Workflows]
      summary: Trigger job-crawling Cloudflare Workflow
      responses:
        '202':
          description: Workflow started

  /api/workflows/application:
    post:
      tags: [Workflows]
      summary: Trigger application Cloudflare Workflow
      responses:
        '202':
          description: Workflow started

  /api/workflows/resume-sync:
    post:
      tags: [Workflows]
      summary: Trigger resume-sync Cloudflare Workflow
      responses:
        '202':
          description: Workflow started

  /api/workflows/daily-report:
    post:
      tags: [Workflows]
      summary: Trigger daily-report Cloudflare Workflow
      responses:
        '202':
          description: Workflow started

  /api/workflows/{workflowType}/{instanceId}:
    get:
      tags: [Workflows]
      summary: Read workflow instance status
      parameters:
        - in: path
          name: workflowType
          schema: { type: string }
          required: true
        - in: path
          name: instanceId
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Workflow status

  /api/workflows/application/{instanceId}/approve:
    post:
      tags: [Workflows]
      summary: Approve a pending application workflow step
      parameters:
        - in: path
          name: instanceId
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Approval recorded

  /api/workflows/application/{instanceId}/reject:
    post:
      tags: [Workflows]
      summary: Reject a pending application workflow step
      parameters:
        - in: path
          name: instanceId
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Rejection recorded

  # Automation triggers (apps/job-dashboard/src/routes/automation.js)
  /api/automation/search:
    post:
      tags: [Automation]
      summary: Trigger job-search webhook
      responses:
        '202':
          description: Search triggered

  /api/automation/apply:
    post:
      tags: [Automation]
      summary: Trigger auto-apply webhook
      responses:
        '202':
          description: Auto-apply triggered

  /api/automation/report:
    post:
      tags: [Automation]
      summary: Trigger daily-report webhook
      responses:
        '202':
          description: Report triggered

  /api/automation/resume:
    post:
      tags: [Automation]
      summary: Trigger resume-sync webhook
      responses:
        '202':
          description: Resume sync triggered

  /api/automation/profile-sync:
    post:
      tags: [Automation]
      summary: Trigger profile-sync webhook
      responses:
        '202':
          description: Profile sync triggered

  /api/automation/profile-sync/history:
    get:
      tags: [Automation]
      summary: Profile sync history
      responses:
        '200':
          description: Profile sync history

  /api/automation/profile-sync/{syncId}:
    get:
      tags: [Automation]
      summary: Profile sync status by ID
      parameters:
        - in: path
          name: syncId
          schema: { type: string }
          required: true
      responses:
        '200':
          description: Profile sync status

  /api/automation/profile-sync/callback:
    post:
      tags: [Automation]
      summary: Profile-sync completion callback
      responses:
        '200':
          description: Callback accepted

  /api/auto-apply/config:
    get:
      tags: [Automation]
      summary: Auto-apply configuration
      responses:
        '200':
          description: Auto-apply configuration

  # Resume master (apps/job-dashboard/src/routes/automation.js)
  /api/resume/master:
    get:
      tags: [Resume]
      summary: Read master resume blob
      responses:
        '200':
          description: Master resume
    put:
      tags: [Resume]
      summary: Upload master resume
      responses:
        '200':
          description: Master resume updated

  /api/test/chaos-resumes:
    get:
      tags: [Test]
      summary: Test endpoint for Wanted chaos-resume API
      responses:
        '200':
          description: Test response

  # Admin (apps/job-dashboard/src/routes/admin.js)
  /api/diagnostics/bindings:
    get:
      tags: [Admin]
      summary: Diagnose Cloudflare Worker bindings (D1, KV, AI, browser)
      responses:
        '200':
          description: Binding diagnostics

  /api/config:
    get:
      tags: [Admin]
      summary: Read worker config from D1
      responses:
        '200':
          description: Worker config
    put:
      tags: [Admin]
      summary: Update worker config in D1
      responses:
        '200':
          description: Worker config updated

  /api/queue/enqueue:
    post:
      tags: [Admin]
      summary: Enqueue a job to the crawl-tasks queue
      responses:
        '202':
          description: Job enqueued

  /api/queue/status:
    get:
      tags: [Admin]
      summary: Queue status overview
      responses:
        '200':
          description: Queue status

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          example: healthy
        version:
          type: string
          example: 1.40.11
        deployed_at:
          type: string
          format: date-time
        git_sha:
          type: string
          description: >-
            Build-time commit SHA injected by the portfolio worker build.
            Used by post-deploy-verify.yml to confirm the deployed bundle
            matches the pushed HEAD. Defaults to 'unknown' when the build
            environment exports no SHA.
          example: 049b4c5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
        uptime_seconds:
          type: number
        bindings:
          type: object
          properties:
            d1:
              type: object
              properties:
                healthy:
                  type: boolean
                latency_ms:
                  type: number
            kv:
              type: object
              properties:
                healthy:
                  type: boolean
                latency_ms:
                  type: number
        metrics:
          type: object
          properties:
            requests_total:
              type: number
            requests_success:
              type: number
            requests_error:
              type: number
            vitals_received:
              type: number

    Job:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        company:
          type: string
        position:
          type: string
        source:
          $ref: '#/components/schemas/AutoApplyPlatform'
        matchScore:
          type: integer
        url:
          type: string

    Application:
      type: object
      properties:
        id:
          type: string
        job:
          $ref: '#/components/schemas/Job'
        status:
          type: string
          enum: [pending, saved, applied, viewed, in_progress, interview, offer, rejected, withdrawn, expired]
        appliedAt:
          type: string
          format: date-time
        notes:
          type: array
          items:
            type: string
        source:
          type: string

    ApplicationUpdate:
      type: object
      properties:
        status:
          type: string
        notes:
          type: array
          items:
            type: string

    ForeignAtsPlatform:
      type: string
      enum: [ashby, greenhouse, lever, smartrecruiters, teamtailor, workday]

    ForeignAtsLocation:
      type: object
      additionalProperties: false
      required: [countryCode]
      properties:
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        region:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        remote:
          type: boolean

    ForeignAtsSource:
      type: object
      additionalProperties: false
      required: [platform, sourceUrl]
      properties:
        platform:
          $ref: '#/components/schemas/ForeignAtsPlatform'
        sourceUrl:
          type: string
          format: uri
          maxLength: 2000
        externalJobId:
          type: string
          minLength: 1
          maxLength: 200
        requisitionId:
          type: string
          minLength: 1
          maxLength: 200
        location:
          $ref: '#/components/schemas/ForeignAtsLocation'

    ForeignAtsApplicationPacketMetadata:
      type: object
      additionalProperties: false
      required: [source, capturedAt]
      properties:
        source:
          $ref: '#/components/schemas/ForeignAtsSource'
        capturedAt:
          type: string
          format: date-time
        externalApplicationId:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [pending, saved, applied, viewed, in_progress, interview, offer, rejected, withdrawn, expired]
        raw:
          type: object

    ForeignAtsApplicationPacket:
      type: object
      additionalProperties: false
      required: [metadata]
      properties:
        metadata:
          $ref: '#/components/schemas/ForeignAtsApplicationPacketMetadata'
        application:
          $ref: '#/components/schemas/Application'

    AutoApplyPlatform:
      type: string
      enum: [wanted, linkedin, remember, jobkorea, saramin, greenhouse, lever, ashby]

    ForeignAtsAdapterCapability:
      type: object
      additionalProperties: false
      properties:
        platform:
          $ref: '#/components/schemas/ForeignAtsPlatform'
        mode:
          type: string
          enum: [dry-run, manual-review, supported-submit]
        canSubmit:
          type: boolean
          description: True only for adapters that support real submissions.
        dryRunFirst:
          type: boolean
          description: Adapter must support dry-run preview before any real submission.

    ForeignAtsApprovalMetadata:
      type: object
      additionalProperties: false
      properties:
        score:
          type: number
          nullable: true
        source:
          $ref: '#/components/schemas/AutoApplyPlatform'
        adapterCapability:
          $ref: '#/components/schemas/ForeignAtsAdapterCapability'
        packetPath:
          type: string
          nullable: true
        approvalId:
          type: string
        approvedAt:
          type: string
          format: date-time

    AutoApplyRunCandidate:
      type: object
      required: [id, source, company]
      properties:
        id:
          type: string
        sourceId:
          type: string
        source:
          $ref: '#/components/schemas/AutoApplyPlatform'
        company:
          type: string
        position:
          type: string
        title:
          type: string
        sourceUrl:
          type: string
          format: uri
        applicationUrl:
          type: string
          format: uri
        externalJobId:
          type: string
        payloadHash:
          type: string
        atsStub:
          type: boolean
        matchScore:
          type: number
        approvalId:
          type: string
        approvalMetadata:
          $ref: '#/components/schemas/ForeignAtsApprovalMetadata'
        applicationPacket:
          $ref: '#/components/schemas/ForeignAtsApplicationPacket'

    ForeignAtsSubmissionPreview:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
        dryRun:
          type: boolean
        networkWrite:
          type: boolean
          description: False for Greenhouse, Lever, and Ashby dry-run previews.
        action:
          type: string
          enum: [would_apply]
        status:
          type: string
          enum: [dry-run]
        platform:
          $ref: '#/components/schemas/ForeignAtsPlatform'
        jobId:
          type: string
        sourceUrl:
          type: string
        company:
          type: string
        position:
          type: string
        resumeId:
          type: string
        matchScore:
          type: number
          nullable: true
        approvalMetadata:
          $ref: '#/components/schemas/ForeignAtsApprovalMetadata'

    AutoApplyRunRequest:
      type: object
      properties:
        dryRun:
          type: boolean
          default: true
          description: Must remain true for default QA and dry-run walkthroughs.
        atsStub:
          type: boolean
          default: false
          description: Enables Greenhouse, Lever, and Ashby stub jobs only when dryRun is true.
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/AutoApplyPlatform'
          example: [greenhouse, lever, ashby]
        keywords:
          type: array
          items:
            type: string
        minScore:
          type: integer
        maxApplications:
          type: integer
        candidates:
          type: array
          description: Explicit opt-in candidate list for walkthroughs and gated submits.
          items:
            $ref: '#/components/schemas/AutoApplyRunCandidate'
        maxDepth:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
        approvalId:
          type: string
          description: Approval identifier required by real-submission opt-in flows.
        explicitSubmit:
          type: boolean
          default: false
          description: Must be true with dryRun false before any real ATS submission.
        submitOptIn:
          type: boolean
          default: false
          description: Secondary operator opt-in for T16/T17 real-submit paths.

    AutoApplyRunResponse:
      type: object
      properties:
        success:
          type: boolean
        dryRun:
          type: boolean
        submitted:
          type: integer
          description: Zero for dry-run ATS walkthroughs.
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/AutoApplyPlatform'
        config:
          type: object
          properties:
            keywords:
              type: array
              items:
                type: string
            minMatchScore:
              type: integer
            maxDailyApplications:
              type: integer
        todayApplications:
          type: integer
        remaining:
          type: integer
        results:
          $ref: '#/components/schemas/AutoApplyRunResults'
        recursion:
          type: object
          properties:
            maxDepth:
              type: integer
            maxVisitedDepth:
              type: integer
            visited:
              type: integer
            truncated:
              type: integer
        previews:
          type: array
          items:
            $ref: '#/components/schemas/ForeignAtsSubmissionPreview'

    AutoApplyRunResults:
      type: object
      properties:
        searched:
          type: integer
        matched:
          type: integer
        applied:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        byPlatform:
          type: object
          additionalProperties:
            type: object
            properties:
              searched:
                type: integer
              matched:
                type: integer
              applied:
                type: integer
        jobs:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              source:
                $ref: '#/components/schemas/AutoApplyPlatform'
              position:
                type: string
              company:
                type: string
              matchScore:
                type: number
              url:
                type: string
              action:
                type: string
                enum: [would_apply, applied, saved_for_manual_apply, skipped_already_applied]
              decisionTrace:
                type: array
                items:
                  type: object

    SearchResult:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        totalJobs:
          type: integer
        keyword:
          type: string

    Stats:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        bySource:
          type: object
          additionalProperties:
            type: integer
