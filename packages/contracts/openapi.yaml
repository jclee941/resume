openapi: 3.0.3
info:
  title: Job Automation API
  description: REST API for job search, application tracking, and auto-apply automation
  version: 1.4.0
  contact:
    email: qws941@kakao.com

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://resume.jclee.me/job
    description: Production (Cloudflare Worker)

tags:
  - name: Health
    description: Service health endpoints
  - name: Applications
    description: Job application CRUD
  - name: Search
    description: Job search across platforms
  - name: Stats
    description: Statistics and reports
  - name: AutoApply
    description: Automated job application

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health:
    get:
      tags: [Health]
      summary: API health check
      responses:
        '200':
          description: API healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/health/notifications:
    get:
      tags: [Health]
      summary: Notification subsystem health (Telegram + n8n configuration)
      responses:
        '200':
          description: Notification configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  telegram:
                    type: object
                  n8n:
                    type: object

  /api/status:
    get:
      tags: [Health]
      summary: Service status with deploy metadata + bindings overview
      responses:
        '200':
          description: Service status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  deployed_at:
                    type: string
                  bindings:
                    type: object

  /api/applications:
    get:
      tags: [Applications]
      summary: List applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, applied, interviewing, rejected, offered, withdrawn]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

    post:
      tags: [Applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  $ref: '#/components/schemas/Job'
                options:
                  type: object
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

  /api/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [Applications]
      summary: Get application by ID
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Not found

    put:
      tags: [Applications]
      summary: Update application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  application:
                    $ref: '#/components/schemas/Application'

    delete:
      tags: [Applications]
      summary: Delete application
      responses:
        '200':
          description: Deleted

  /api/applications/{id}/status:
    put:
      tags: [Applications]
      summary: Update application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, applied, interviewing, rejected, offered, withdrawn]
                note:
                  type: string
                notifyN8n:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Status updated

  /api/search:
    get:
      tags: [Search]
      summary: Search jobs
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            default: 보안 엔지니어
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: minScore
          in: query
          schema:
            type: integer
            default: 50
        - name: platforms
          in: query
          description: Comma-separated platform list
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  /api/search/batch:
    post:
      tags: [Search]
      summary: Batch search with multiple keywords
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                  default: [보안 엔지니어, DevOps, 인프라]
                platforms:
                  type: array
                  items:
                    type: string
                limit:
                  type: integer
                  default: 10
                minScore:
                  type: integer
                  default: 60
      responses:
        '200':
          description: Batch search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
                  totalJobs:
                    type: integer

  /api/stats:
    get:
      tags: [Stats]
      summary: Get application statistics
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /api/stats/weekly:
    get:
      tags: [Stats]
      summary: Get weekly report
      responses:
        '200':
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'

  /api/report:
    get:
      tags: [Stats]
      summary: Get daily report
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily report

  /api/report/weekly:
    get:
      tags: [Stats]
      summary: Get weekly report (alias)
      responses:
        '200':
          description: Weekly report

  /api/cleanup:
    post:
      tags: [Stats]
      summary: Cleanup old applications
      responses:
        '200':
          description: Cleanup result

  /api/auto-apply/status:
    get:
      tags: [AutoApply]
      summary: Get auto-apply status
      responses:
        '200':
          description: Auto-apply status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoApplyStatus'

  /api/auto-apply/run:
    post:
      tags: [AutoApply]
      summary: Start auto-apply process
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: true
                keywords:
                  type: array
                  items:
                    type: string
                minScore:
                  type: integer
                maxApplications:
                  type: integer
      responses:
        '202':
          description: Auto-apply started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: string

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.4.0
        uptime:
          type: number

    Job:
      type: object
      properties:
        id:
          type: integer
        company:
          type: string
        position:
          type: string
        source:
          type: string
          enum: [wanted, saramin, jobkorea, linkedin]
        matchScore:
          type: integer
        url:
          type: string

    Application:
      type: object
      properties:
        id:
          type: string
        job:
          $ref: '#/components/schemas/Job'
        status:
          type: string
          enum: [pending, applied, interviewing, rejected, offered, withdrawn]
        appliedAt:
          type: string
          format: date-time
        notes:
          type: array
          items:
            type: string
        source:
          type: string

    ApplicationUpdate:
      type: object
      properties:
        status:
          type: string
        notes:
          type: array
          items:
            type: string

    SearchResult:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        totalJobs:
          type: integer
        keyword:
          type: string

    Stats:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        bySource:
          type: object
          additionalProperties:
            type: integer
        thisWeek:
          type: integer
        today:
          type: integer

    WeeklyReport:
      type: object
      properties:
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        applications:
          type: integer
        interviews:
          type: integer
        offers:
          type: integer
        rejections:
          type: integer

    AutoApplyStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, completed, failed]
        lastRun:
          type: string
          format: date-time
        lastResult:
          type: object
        nextScheduled:
          type: string
          format: date-time
        progress:
          type: object
          properties:
            current:
              type: integer
            total:
              type: integer
        uptime:
          type: number
        memoryUsage:
          type: number

  # ===== ADDED 2026-04-29 closing OpenAPI drift (audit P1) =====
  # Auth routes (apps/job-dashboard/src/routes/auth.js)
  /api/auth/status:
    get:
      tags: [Auth]
      summary: Current admin session status
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  expiresAt:
                    type: string

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Mint a 4h HMAC session token from a valid ADMIN_TOKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Sets adminToken cookie
        '401':
          description: Invalid token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear admin session cookie
      responses:
        '200':
          description: Session cleared

  /api/auth/sync:
    post:
      tags: [Auth]
      summary: Ingest platform cookies from external script (requires X-Auth-Sync-Secret)
      parameters:
        - in: header
          name: X-Auth-Sync-Secret
          schema:
            type: string
          required: true
      responses:
        '200': { description: Synced }
        '401': { description: Invalid secret }
        '503': { description: AUTH_SYNC_SECRET not configured }

  /api/auth/set:
    post:
      tags: [Auth]
      summary: Manually set platform auth (admin)

  /api/auth/profile:
    get:
      tags: [Auth]
      summary: Read Wanted profile via authenticated session

  /api/auth/{platform}:
    delete:
      tags: [Auth]
      summary: Clear platform-specific session
      parameters:
        - in: path
          name: platform
          schema: { type: string }
          required: true

  # Workflows (apps/job-dashboard/src/routes/workflows.js)
  /api/workflows/job-crawling:
    post:
      tags: [Workflows]
      summary: Trigger job-crawling Cloudflare Workflow

  /api/workflows/application:
    post:
      tags: [Workflows]
      summary: Trigger application Cloudflare Workflow

  /api/workflows/resume-sync:
    post:
      tags: [Workflows]
      summary: Trigger resume-sync Cloudflare Workflow

  /api/workflows/daily-report:
    post:
      tags: [Workflows]
      summary: Trigger daily-report Cloudflare Workflow

  /api/workflows/{workflowType}/{instanceId}:
    get:
      tags: [Workflows]
      summary: Read workflow instance status
      parameters:
        - in: path
          name: workflowType
          schema: { type: string }
          required: true
        - in: path
          name: instanceId
          schema: { type: string }
          required: true

  /api/workflows/application/{instanceId}/approve:
    post:
      tags: [Workflows]
      summary: Approve a pending application workflow step
      parameters:
        - in: path
          name: instanceId
          schema: { type: string }
          required: true

  /api/workflows/application/{instanceId}/reject:
    post:
      tags: [Workflows]
      summary: Reject a pending application workflow step
      parameters:
        - in: path
          name: instanceId
          schema: { type: string }
          required: true

  # Automation triggers (apps/job-dashboard/src/routes/automation.js)
  /api/automation/search:
    post:
      tags: [Automation]
      summary: Trigger job-search webhook

  /api/automation/apply:
    post:
      tags: [Automation]
      summary: Trigger auto-apply webhook

  /api/automation/report:
    post:
      tags: [Automation]
      summary: Trigger daily-report webhook

  /api/automation/resume:
    post:
      tags: [Automation]
      summary: Trigger resume-sync webhook

  /api/automation/profile-sync:
    post:
      tags: [Automation]
      summary: Trigger profile-sync webhook

  /api/automation/profile-sync/history:
    get:
      tags: [Automation]
      summary: Profile sync history

  /api/automation/profile-sync/{syncId}:
    get:
      tags: [Automation]
      summary: Profile sync status by ID
      parameters:
        - in: path
          name: syncId
          schema: { type: string }
          required: true

  /api/automation/profile-sync/callback:
    post:
      tags: [Automation]
      summary: Profile-sync completion callback

  /api/auto-apply/config:
    get:
      tags: [Automation]
      summary: Auto-apply configuration

  # Resume master (apps/job-dashboard/src/routes/automation.js)
  /api/resume/master:
    get:
      tags: [Resume]
      summary: Read master resume blob
    put:
      tags: [Resume]
      summary: Upload master resume

  /api/test/chaos-resumes:
    get:
      tags: [Test]
      summary: Test endpoint for Wanted chaos-resume API

  # Admin (apps/job-dashboard/src/routes/admin.js)
  /api/diagnostics/bindings:
    get:
      tags: [Admin]
      summary: Diagnose Cloudflare Worker bindings (D1, KV, AI, browser)

  /api/config:
    get:
      tags: [Admin]
      summary: Read worker config from D1
    put:
      tags: [Admin]
      summary: Update worker config in D1

  /api/queue/enqueue:
    post:
      tags: [Admin]
      summary: Enqueue a job to the crawl-tasks queue

  /api/queue/status:
    get:
      tags: [Admin]
      summary: Queue status overview
