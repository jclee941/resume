# Grafana provisioned datasources
# Deployed to: Docker host (192.168.50.215) → /opt/monitoring/configs/grafana/provisioning/datasources/datasources.yml
# Legacy:      LXC 104 (192.168.50.100) — retained for reference only
# Docker Compose: /opt/monitoring/docker-compose.yml (mounts ./configs/grafana/provisioning:/etc/grafana/provisioning:ro)
#
# To apply changes:
#   1. Edit this file
#   2. SCP to host: scp -i ~/.ssh/id_rsa datasources.yml root@192.168.50.215:/opt/monitoring/configs/grafana/provisioning/datasources/
#      (legacy LXC path: /opt/grafana/provisioning/datasources/datasources.yml on 192.168.50.100)
#   3. Restart: ssh -i ~/.ssh/id_rsa root@192.168.50.215 'cd /opt/monitoring && docker compose restart grafana'
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL}
    database: 'logs-*'
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      logMessageField: 'message'
      logLevelField: 'log.level'
    editable: false

  - name: Elasticsearch-Filebeat
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL}
    database: 'filebeat-*'
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      logMessageField: 'message'
      logLevelField: 'log.level'
    editable: false

  - name: SafeWork2 Logs
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL}
    database: 'safework2-logs-*'
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      logMessageField: 'message'
      logLevelField: 'level'
    editable: false

  - name: Elasticsearch-Resume
    uid: elasticsearch-resume
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL}
    database: 'resume-logs-*'
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      logMessageField: 'message'
      logLevelField: 'level'
    isDefault: false
    editable: true
