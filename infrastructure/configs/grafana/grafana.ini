# Grafana server configuration
# Deployed to: Docker host (192.168.50.215) → /opt/monitoring/configs/grafana/grafana.ini
# Legacy:      LXC 104 (192.168.50.100) — retained for reference only
# Docker Compose: /opt/monitoring/docker-compose.yml (mounts ./configs/grafana.ini:/etc/grafana/grafana.ini:ro)
#
# Purpose: Enable public dashboard sharing for resume-portfolio without requiring login.
# Anonymous users get Viewer role only. Admin access remains via basic auth.

[server]
protocol = http
http_port = 3000
domain = grafana.jclee.me
root_url = https://grafana.jclee.me
serve_from_sub_path = false

[security]
# Allow embedding in portfolio site via iframe
allow_embedding = true
# Secure cookie settings for cross-origin access
cookie_samesite = none
cookie_secure = true

[auth]
# Disable login form on the landing page; anonymous is default
# Admin users can still reach /login directly when needed
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[auth.basic]
# Keep enabled for admin fallback access only
enabled = true

[feature_toggles]
# Enable public dashboard sharing (Grafana 10+)
publicDashboards = true

[dashboards]
# Allow Viewer users to see the default home dashboard
default_home_dashboard_path =

[users]
# Prevent anonymous viewers from modifying anything
viewers_can_edit = false

[public_dashboards]
# Enable public dashboards globally
enabled = true

[panels]
# Required for some panel types used in public dashboards
disable_sanitize_html = false

[log]
mode = console
level = info

[paths]
provisioning = /etc/grafana/provisioning

# Admin credentials — set via environment variable or Docker secret
# NEVER commit real values here
[admin]
user = admin
