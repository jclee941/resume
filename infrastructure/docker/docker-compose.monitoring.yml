# Full monitoring stack: Grafana + Prometheus + Loki + Alertmanager + Jaeger
# Deployed to: Docker host (192.168.50.215) → /opt/monitoring/docker-compose.yml
# Legacy:      LXC 104 (192.168.50.100) — retained for reference only
#
# Usage:
#   cd /opt/monitoring && docker compose -f docker-compose.monitoring.yml up -d
#
# Notes:
#   - Grafana public dashboards require the feature toggle in grafana.ini.
#   - Anonymous auth is Viewer-only; admin access uses basic auth fallback.
#   - Update ELASTICSEARCH_URL and GRAFANA_ADMIN_PASSWORD via .env or export.

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Admin password — override via .env or shell export; never commit real values
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      # Elasticsearch URL consumed by provisioned datasources
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://localhost:9200}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../configs/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      # Optional: mount individual dashboard JSONs if not using provisioning provider
      # - ../configs/grafana/resume-portfolio-dashboard.json:/var/lib/grafana/dashboards/resume-portfolio-dashboard.json:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - prometheus-data:/prometheus
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../configs/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
    # The image ships with a default local-config.yaml; override with:
    # command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - alertmanager-data:/alertmanager
      - ../configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - '16686:16686'
      - '14268:14268'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    volumes:
      - jaeger-data:/badger
    networks:
      - monitoring

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alertmanager-data:
  jaeger-data:

networks:
  monitoring:
    driver: bridge
